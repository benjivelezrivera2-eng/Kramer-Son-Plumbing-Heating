name: Visibility measurement

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/measure-visibility.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visibility-delta
          path: |
            measurement/latest.json
            measurement/delta.md
